[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-analysis"
version = "0.1.0"
description = "Reproducible feature extraction for pre/post proxy traffic captures"
requires-python = ">=3.12"
dependencies = [
  "dpkt>=1.9.8",
  "numpy>=1.26",
  "pyarrow>=15",
  "PyYAML>=6",
  "scipy>=1.12",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
proxy-analysis = "proxy_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
